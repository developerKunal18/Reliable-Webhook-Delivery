services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]

  worker:
    build:
      context: .
      dockerfile: worker.Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
